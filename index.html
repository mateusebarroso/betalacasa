<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lachonete-Beta</title>
    <link rel="stylesheet" href="lachonete.css" />
  </head>
  <body>
    <div class="container">
      <main>
        <h1 id="text1"></h1>
        <section>
          <ul>
            <li>🍔 O sabor que conquistou Monte Alegre</li>
            <li>🛵 Delivery ou retirada 🥩</li>
            <li>Carne 100% bovina ⏰️ Todos os dias | 19h às 23h</li>
            <li>👇🏻Peça pelo WhatsApp 93992350756</li>
          </ul>
        </section>
        <div class="imagens">
          <div>
            <figure class="foto-largura">
              <img src="foto2.webp" alt="" />
            </figure>

            <figure class="foto-legenda">
              <img src="foto4.webp" alt="" />

              <figcaption class="texto-legenda">
                <h3>LA CASA HAMBÚRGUERIA</h3>
                <p>Já pediu seu hot-dog do La Casa? 🤌🏻🤤</p>
              </figcaption>
            </figure>
          </div>
          <div>
            <figure class="foto-legenda">
              <img src="foto5.webp" alt="" />

              <figcaption class="texto-legenda">
                <h3>LA CASA HAMBÚRGUERIA</h3>
                <p>Parabéns para a nossa terrinha querida! 💚</p>
              </figcaption>
            </figure>

            <figure class="foto-legenda">
              <img src="foto6.webp" alt="" />

              <figcaption class="texto-legenda">
                <h3>LA CASA HAMBÚRGUERIA</h3>
                <p>Sextou, e vocês já sabem onde é né? 🤭</p>
              </figcaption>
            </figure>
          </div>
        </div>
      </main>
      <footer>
        <p>
          Faça seu pedido que levamos até você!<br />
          ☺️ 📲 99235-0756 💸Aceitamos Cartões e Pix <br />
          🛵Delivery ON
        </p>
      </footer>
    </div>
    <script>
      const element = document.querySelector("#text1");

      const frases = ["LA CASA HAMBÚRGUERIA"];

      let fraseIndex = 0;
      let charIndex = 0;
      let apagando = false;

      function digitar() {
        const fraseAtual = frases[fraseIndex];

        if (!apagando) {
          element.textContent = fraseAtual.substring(0, charIndex + 1);
          charIndex++;

          if (charIndex === fraseAtual.length) {
            apagando = true;
            setTimeout(digitar, 1200); // pausa antes de apagar
            return;
          }
        } else {
          element.textContent = fraseAtual.substring(0, charIndex - 1);
          charIndex--;

          if (charIndex === 0) {
            apagando = false;
            fraseIndex = (fraseIndex + 1) % frases.length;
          }
        }

        setTimeout(digitar, apagando ? 50 : 100);
      }

      digitar();
    </script>
  </body>
</html>
